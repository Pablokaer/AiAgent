name: CI - integration (medium gate)

on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]

jobs:
  medium-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Unit + integration tests
        run: dotnet test --no-build --configuration Release --filter "Category!=E2E"
