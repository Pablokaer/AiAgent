name: CI - dev (fast gate)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration&Category!=E2E"
