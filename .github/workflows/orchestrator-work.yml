name: Orchestrator - work an issue

# Runs the stack-agnostic AI loop against the TARGET repository named in the issue.
# Triggered by orchestrator-poll.yml (workflow_dispatch) or a Linear webhook relay
# (repository_dispatch: work-linear-issue).
# Secrets: ANTHROPIC_API_KEY, LINEAR_API_KEY, TARGET_REPOS_PAT
#   (TARGET_REPOS_PAT = PAT with Contents:write + Pull requests:write on the target repos)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue identifier (e.g. AID-1)"
        required: true
        type: string
      repo_url:
        description: "Target repo URL (https://github.com/owner/name)"
        required: true
        type: string
  repository_dispatch:
    types: [work-linear-issue]

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ github.event.inputs.issue || github.event.client_payload.issue }}
      REPO_URL: ${{ github.event.inputs.repo_url || github.event.client_payload.repo_url }}
    steps:
      - name: Checkout orchestrator (.claude loop + scripts)
        uses: actions/checkout@v4

      # Common toolchains so the loop can build most target stacks.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git + gh auth for target repos
        env:
          GH_PAT: ${{ secrets.TARGET_REPOS_PAT }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GH_PAT" > "$HOME/.git-credentials"
          git config --global user.name "ai-loop"
          git config --global user.email "ai-loop@users.noreply.github.com"

      - name: Fetch the issue into ISSUE.md
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE: ${{ env.ISSUE }}
          OUT: ISSUE.md
        run: python scripts/fetch_issue.py

      - name: Run the AI loop (clone target -> implement -> test -> review -> PR)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.TARGET_REPOS_PAT }}
        run: |
          set -euo pipefail
          claude -p "/work-issue ${ISSUE} ${REPO_URL}" \
            --permission-mode acceptEdits \
            --dangerously-skip-permissions \
            --allowedTools Read,Write,Edit,Bash,Grep,Glob \
            --max-turns 40 \
            --output-format json
